    <!-- Scroll motion is switched on only when the browser supports it and the visitor has not asked for reduced motion.
         If no element has been revealed within 4 seconds, everything is shown. Without this class nothing is hidden. -->
    <script>
      (function () {
        try {
          var d = document.documentElement;
          if ('IntersectionObserver' in window && !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)) {
            d.classList.add('motion-ready');
            setTimeout(function () { if (!window.__motionReady || !document.querySelector('[data-reveal].in')) d.classList.remove('motion-ready'); }, 4000);
          }
        } catch (e) {}
      })();
    </script>

    <!-- Apply the saved theme before first paint to avoid a flash. -->
    <script>
      try {
        var t = localStorage.getItem('pkg-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
